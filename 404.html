<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,300..800&family=Anek+Devanagari:wdth,wght@75..125,300..800&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<script>/* Preloader: the MKD mark on the first page of a visit (styles in styles.css, "preloader") */
(function (h) {
  var key = "mkd-intro", t0 = Date.now(), done = false;
  window.mkdReady = function (fn) {
    if (!h.classList.contains("is-preloading") || h.classList.contains("is-loaded")) fn();
    else document.addEventListener("mkd:ready", fn, { once: true });
  };
  try { if (sessionStorage.getItem(key)) return; } catch (e) { return; }
  h.classList.add("is-preloading");
  function go() {
    if (done) return; done = true;
    setTimeout(function () {
      h.classList.add("is-loaded");
      try { sessionStorage.setItem(key, "1"); } catch (e) {}
      document.dispatchEvent(new Event("mkd:ready"));
    }, Math.max(0, 1000 - (Date.now() - t0)));
  }
  addEventListener("load", go);
  setTimeout(go, 2600);
})(document.documentElement);
</script>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="nf">
  <div class="nf-inner">
    <a href="/"><img src="/brand/mkd-mark.svg" alt="Maa Kamakhya Darbar Fragrances, home" width="72" height="70"></a>
    <p class="nf-hi" lang="hi">खुशबू यहाँ नहीं है</p>
    <h1>This page has drifted off, like smoke.</h1>
    <p>The link may be old or mistyped. Everything we make is a click away.</p>
    <div class="hero-actions">
      <a class="btn btn-primary" href="/">Go to the home page</a>
      <a class="btn btn-ghost" href="/products.html">Visit the shop</a>
    </div>
  </div>
</main>
</body>
