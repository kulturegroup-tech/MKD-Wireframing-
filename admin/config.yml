# Admin for the Tiranga Agarbatti shop and the Maa Kamakhya Darbar Fragrances website.
# Orders are not here: they are at /admin/orders.html.
# Open https://<your-site>/admin, sign in with GitHub, edit, and press Save.
# Every save is a commit to the repo; Netlify then rebuilds the site in about a minute.

backend:
  name: github
  repo: kulturegroup-tech/MKD-Wireframing-
  branch: main
  commit_messages:
    create: "Add {{collection}}: {{slug}}"
    update: "Update {{collection}}: {{slug}}"
    delete: "Remove {{collection}}: {{slug}}"
    uploadMedia: "Upload {{path}}"
    deleteMedia: "Delete {{path}}"

site_url: https://tirangaagarbatti.com
display_url: https://tirangaagarbatti.com
logo_url: /favicon.svg

# Uploaded photos go here and are resized and converted to WebP in the browser before upload,
# so phone photos are fine.
media_folder: /uploads
public_folder: /uploads
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000

collections:
  # ---------------------------------------------------------------- products
  - name: products
    label: Products
    label_singular: Product
    description: Everything in the shop. Each product gets its own page with Add to cart. The first photo is the one shown on the card.
    folder: content/products
    format: json
    extension: json
    create: true
    delete: true
    identifier_field: name
    slug: "{{slug}}"
    summary: "{{name}} · {{brand}} · {{category}}"
    sortable_fields: [name, brand, category, order]
    view_groups:
      - { label: Brand, field: brand }
      - { label: Category, field: category }
    media_folder: /uploads/products
    public_folder: /uploads/products
    fields:
      - { label: Product name, name: name, widget: string }
      - label: Brand
        name: brand
        widget: select
        options: [Tiranga, Sacred, Sacred Selections]
        default: Tiranga
      - label: Category
        name: category
        widget: select
        options:
          - { label: Agarbatti, value: agarbatti }
          - { label: Bambooless sticks, value: bambooless }
          - { label: Dhoopbatti, value: dhoopbatti }
          - { label: Dhoop cones, value: dhoop-cone }
          - { label: Wet dhoop, value: wet-dhoop }
          - { label: Havan cup dhoop, value: havan-cup }
          - { label: Jar packs, value: jar }
          - { label: Gulab jal, value: gulab-jal }
          - { label: Puja essentials (ghee and more), value: puja-essentials }
          - { label: Poojan kits, value: kits }
          - { label: Bulk packs (wholesale), value: bulk }
        default: agarbatti
      - label: Photos
        name: images
        widget: image
        multiple: true
        required: false
        hint: The first photo is shown on the card; the rest appear in the product view. Phone photos are fine.
      - label: Packshot on a white background
        name: packshot
        widget: boolean
        default: false
        required: false
        hint: Turn on for product-on-white photos so the whole pack is shown, not cropped.
      - label: Hindi name
        name: hindi
        widget: string
        required: false
        hint: Shown as the big word on the card when there is no photo, for example मोगरा.
      - { label: Pack and size, name: format, widget: string, required: false, hint: "For example: Premium agarbatti, box of 100 g" }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Price (₹), name: price, widget: number, value_type: float, required: false, hint: "The selling price, GST included. A product without a price shows on the site but can't be added to the cart. If it comes in several packs, leave this empty and fill in Packs and sizes below." }
      - { label: MRP (₹), name: mrp, widget: number, value_type: float, required: false, hint: Shown struck through when it is higher than the price. }
      - label: Packs and sizes
        name: variants
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.label}}: ₹{{fields.price}}"
        hint: "Only for products sold in more than one pack, for example 50 g box and 100 g box. Each pack has its own price."
        fields:
          - { label: Pack name, name: label, widget: string, hint: "For example: 100 g box, or Pack of 12" }
          - { label: Price (₹), name: price, widget: number, value_type: float }
          - { label: MRP (₹), name: mrp, widget: number, value_type: float, required: false }
          - { label: In stock, name: in_stock, widget: boolean, default: true, required: false }
      - { label: In stock, name: in_stock, widget: boolean, default: true, required: false, hint: Turn off to show the product as Sold out. }
      - { label: Old store link, name: old_url, widget: string, required: false, hint: "The product's address on the old WooCommerce store, so that link (and its Google ranking) forwards here. For example: https://tirangaagarbatti.com/product/…/" }
      - { label: Card badge, name: badge, widget: string, required: false, hint: "A short label on the product card, for example Diwali, Holi or New. Leave empty for none." }
      - { label: Featured, name: featured, widget: boolean, default: false, required: false, hint: Featured products are shown first. }
      - { label: Sort order, name: order, widget: number, value_type: int, default: 100, required: false, hint: Lower numbers are shown first. }
      - { label: Show on the website, name: published, widget: boolean, default: true }

  # ---------------------------------------------------------------- stories
  - name: stories
    label: The Sacred Thought
    label_singular: Story
    description: People stories, journal posts, Minutes with the MD episodes and press coverage.
    folder: content/stories
    format: frontmatter
    extension: md
    create: true
    delete: true
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{title}} · {{category}}"
    sortable_fields: [date, title, category]
    view_groups:
      - { label: Kind, field: category }
    media_folder: /uploads/stories
    public_folder: /uploads/stories
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - label: Kind
        name: category
        widget: select
        options:
          - { label: "People: a person's story", value: people }
          - { label: Journal, value: journal }
          - { label: "Minutes with the MD: an episode", value: md }
          - { label: "In the media: a press article", value: press }
        default: people
      - { label: One-line summary, name: excerpt, widget: text, hint: Shown on the card and in link previews. }
      - { label: Person, name: person, widget: string, required: false }
      - { label: Their role, name: role, widget: string, required: false, hint: "For example: Floor supervisor, Kanpur" }
      - { label: Cover photo, name: cover, widget: image, required: false }
      - { label: What the photo shows, name: cover_alt, widget: string, required: false, hint: For people who cannot see the photo. }
      - { label: Photo caption, name: cover_caption, widget: string, required: false }
      - { label: Video link, name: video, widget: string, required: false, hint: "A YouTube link plays inside the page. Any other link (Instagram, Facebook) shows a “Watch the video” button." }
      - { label: Article link, name: link, widget: string, required: false, hint: "Press only: the card opens this article instead of a page." }
      - { label: Publication, name: source, widget: string, required: false, hint: "Press only, for example: Sugandh India" }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false, hint: Drafts stay off the website. }
      - { label: Story, name: body, widget: markdown, required: false }

  # ---------------------------------------------------------------- home page
  - name: site
    label: Home page
    description: Every headline, paragraph and photo on the home page, plus leadership, awards and the Diwali offer.
    files:
      # every headline, paragraph and photo on the home page (and the products page header)
      - name: home
        label: Page text and images
        file: content/site/home.json
        format: json
        media_folder: /uploads/site
        public_folder: /uploads/site
        fields:
          - label: Hero (top of the home page)
            name: hero
            widget: object
            collapsed: true
            fields:
              - { label: Small line above the headline, name: intro, widget: string, required: false }
              - { label: Headline in Hindi, name: headline_hi, widget: string, required: false }
              - { label: Headline in English, name: headline_en, widget: string, required: false }
              - { label: Paragraph, name: text, widget: text, required: false }
              - label: Slideshow (banners and photos)
                name: slides
                widget: list
                summary: "{{fields.alt}}"
                hint: "The slides change every 4 seconds. Drag to reorder; the first one shows first."
                fields:
                  - { label: Image, name: image, widget: image, hint: "For computers. Best size 2048 × 768." }
                  - { label: Phone image (optional), name: image_mobile, widget: image, required: false, hint: "The version for phones. Best size 1080 × 1350 (portrait). If empty, phones show the main image." }
                  - { label: Designed banner (it has its own text), name: banner, widget: boolean, default: false, required: false, hint: "Shows the whole image with no caption or shading. Turn on for launch and offer banners." }
                  - { label: Link, name: link, widget: string, required: false, hint: "Where a click on this slide goes, for example /product/sacred-tripti-puja-ghee.html. Leave empty for no link." }
                  - { label: Hide after (date), name: until, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, hint: "For offers that end, like the Diwali kit. From the next day the slide disappears by itself. Leave empty to always show." }
                  - { label: Lead until (date), name: lead_until, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, hint: "Keeps this slide in its place until this date; after it, the slide moves behind the others. Leave empty to keep its place." }
                  - { label: Caption on the photo, name: caption, widget: string, required: false }
                  - { label: What the photo shows, name: alt, widget: string, required: false }
                  - label: Keep this part in view on wide screens
                    name: focus
                    widget: select
                    default: center
                    options:
                      - { label: Centre, value: center }
                      - { label: Upper part, value: upper }
                      - { label: Lower part, value: lower }
          - label: Numbers band
            name: numbers
            widget: list
            collapsed: true
            summary: "{{fields.value}}{{fields.suffix}} {{fields.label}}"
            fields:
              - { label: Number, name: value, widget: number, value_type: int }
              - { label: After the number, name: suffix, widget: string, required: false, hint: "For example M or +" }
              - { label: Label, name: label, widget: string }
          - label: Our story
            name: story
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Intro, name: lede, widget: text, required: false }
              - label: Timeline
                name: panels
                widget: list
                summary: "{{fields.year}}: {{fields.title}}"
                fields:
                  - { label: Year or label, name: year, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text, required: false }
                  - { label: Photo, name: image, widget: image, required: false }
                  - { label: What the photo shows, name: alt, widget: string, required: false }
          - label: Leadership section
            name: leadership
            widget: object
            collapsed: true
            hint: The people themselves are edited under Leadership.
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Intro, name: lede, widget: text, required: false }
          - label: Brands
            name: brands
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Intro, name: lede, widget: text, required: false }
              -
                label: Tiranga card
                name: tiranga
                widget: object
                collapsed: true
                fields:
                  - { label: Photo, name: image, widget: image, required: false }
                  - { label: What the photo shows, name: alt, widget: string, required: false }
                  - { label: Tagline, name: tagline, widget: string, required: false }
                  - { label: Text, name: text, widget: text, required: false }
                  - { label: Made for, name: made_for, widget: string, required: false }
                  - { label: Found at, name: found_at, widget: string, required: false }
                  - { label: Button text, name: button_label, widget: string, required: false }
                  - { label: Button link, name: button_link, widget: string, required: false }
              -
                label: Sacred card
                name: sacred
                widget: object
                collapsed: true
                fields:
                  - { label: Photo, name: image, widget: image, required: false }
                  - { label: What the photo shows, name: alt, widget: string, required: false }
                  - { label: Tagline, name: tagline, widget: string, required: false }
                  - { label: Text, name: text, widget: text, required: false }
                  - { label: Made for, name: made_for, widget: string, required: false }
                  - { label: Found at, name: found_at, widget: string, required: false }
                  - { label: Button text, name: button_label, widget: string, required: false }
                  - { label: Button link, name: button_link, widget: string, required: false }
              -
                label: Sacred Selections card
                name: selections
                widget: object
                collapsed: true
                fields:
                  - { label: Photo, name: image, widget: image, required: false }
                  - { label: What the photo shows, name: alt, widget: string, required: false }
                  - { label: Tagline, name: tagline, widget: string, required: false }
                  - { label: Text, name: text, widget: text, required: false }
                  - { label: Made for, name: made_for, widget: string, required: false }
                  - { label: Found at, name: found_at, widget: string, required: false }
                  - { label: Button text, name: button_label, widget: string, required: false }
                  - { label: Button link, name: button_link, widget: string, required: false }
          - label: What we make
            name: products
            widget: object
            collapsed: true
            hint: The products themselves are edited under Products.
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Intro, name: lede, widget: text, required: false }
          - label: Diwali kit section
            name: diwali
            widget: object
            collapsed: true
            hint: The countdown date and order link are under Diwali kit offer.
            fields:
              - { label: Line in Hindi, name: hindi, widget: string, required: false }
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Text, name: text, widget: text, required: false }
              - { label: Inside the kit, name: inside, widget: string, required: false }
              - { label: Idols, name: idols, widget: string, required: false }
              - { label: Price, name: price, widget: string, required: false, hint: "As it should read, for example ₹1,500" }
              - { label: Photo, name: image, widget: image, required: false }
              - { label: What the photo shows, name: alt, widget: string, required: false }
              - label: Smaller kit
                name: mini
                widget: object
                collapsed: true
                hint: The second kit shown under the order buttons.
                fields:
                  - { label: Small line above, name: label, widget: string, required: false }
                  - { label: Kit name, name: name, widget: string, required: false }
                  - { label: Short line, name: text, widget: string, required: false }
                  - { label: Price, name: price, widget: string, required: false }
                  - { label: Photo, name: image, widget: image, required: false }
                  - { label: Link, name: link, widget: string, required: false, hint: "/products.html#product-file-name opens that product on the products page; a store link works too." }
          - label: How it's made
            name: making
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Intro, name: lede, widget: text, required: false }
              - label: Steps
                name: steps
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Step name, name: title, widget: string }
                  - { label: Text, name: text, widget: text, required: false }
                  - { label: Photo, name: image, widget: image, required: false }
                  - { label: What the photo shows, name: alt, widget: string, required: false }
          - label: The Sacred Thought section
            name: thought
            widget: object
            collapsed: true
            hint: The stories themselves are under The Sacred Thought.
            fields:
              - { label: Small label, name: kicker, widget: string, required: false }
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Intro, name: lede, widget: text, required: false }
          - label: Minutes with the MD
            name: md
            widget: object
            collapsed: true
            fields:
              - { label: Small label, name: kicker, widget: string, required: false }
              - { label: Name, name: name, widget: string, required: false }
              - { label: Role, name: role, widget: string, required: false }
              - { label: Text, name: text, widget: text, required: false }
              - { label: Photo, name: photo, widget: image, required: false }
              - { label: What the photo shows, name: alt, widget: string, required: false }
              - { label: Photo caption, name: caption, widget: string, required: false }
          - label: Awards and media section
            name: awards
            widget: object
            collapsed: true
            hint: The awards themselves are under Awards; press links are stories of the kind In the media.
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Intro, name: lede, widget: text, required: false }
          - label: Pushkar Mahayagya band
            name: pushkar
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Text, name: text, widget: text, required: false }
              - label: Figures
                name: figures
                widget: list
                summary: "{{fields.value}} {{fields.label}}"
                fields:
                  - { label: Number, name: value, widget: number, value_type: int }
                  - { label: Label, name: label, widget: string }
          - label: Find a fragrance
            name: library
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Intro, name: lede, widget: text, required: false }
          - label: Built across India band
            name: global
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Text, name: text, widget: text, required: false }
              - { label: Background photo, name: image, widget: image, required: false }
          - label: Partner with us
            name: partner
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Intro, name: lede, widget: text, required: false }
          - label: Products page header
            name: products_page
            widget: object
            collapsed: true
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Intro, name: lede, widget: text, required: false }
      - name: leaders
        label: Leadership
        file: content/site/leaders.json
        format: json
        media_folder: /uploads/people
        public_folder: /uploads/people
        fields:
          - label: People
            name: leaders
            widget: list
            summary: "{{fields.name}}, {{fields.role}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string }
              - { label: Photo, name: photo, widget: image, required: false, hint: A portrait works best (taller than wide). }
              - { label: What the photo shows, name: photo_alt, widget: string, required: false }
              - { label: Short bio, name: bio, widget: text, required: false }
              - { label: Link text, name: link_label, widget: string, required: false }
              - { label: Link, name: link_url, widget: string, required: false }
      - name: awards
        label: Awards
        file: content/site/awards.json
        format: json
        fields:
          - label: Awards
            name: awards
            widget: list
            summary: "{{fields.year}}: {{fields.title}}"
            fields:
              - { label: Year (or a word like Partner), name: year, widget: string }
              - { label: Award, name: title, widget: string }
              - { label: Details, name: text, widget: text, required: false }
      - name: diwali
        label: Diwali kit offer
        file: content/site/diwali.json
        format: json
        fields:
          - { label: Show the offer bar and floating button, name: show_offer, widget: boolean, default: true }
          - { label: Lakshmi Puja date and time, name: puja_time, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", hint: Drives the countdown. }
          - { label: Order link, name: kit_url, widget: string, hint: "The kit's page in the shop, for example /product/sacred-diwali-poojan-kit.html" }
      - name: shop
        label: Shop settings
        file: content/site/shop.json
        format: json
        fields:
          - { label: Online payment (PhonePe), name: online_enabled, widget: boolean, default: true, hint: "Needs the PhonePe keys set in Netlify (see the README)." }
          - { label: Cash on delivery, name: cod_enabled, widget: boolean, default: true }
          - { label: Delivery charge (₹), name: delivery_fee, widget: number, value_type: float, default: 49 }
          - { label: Free delivery from (₹), name: free_delivery_above, widget: number, value_type: float, default: 499, hint: Orders at or above this amount ship free. }
          - { label: Cash on delivery charge (₹), name: cod_fee, widget: number, value_type: float, default: 40 }
          - { label: Cash on delivery up to (₹), name: cod_max, widget: number, value_type: float, default: 3000, hint: Bigger orders must be paid online. }
          - { label: Send new orders to (email), name: order_email, widget: string }
          - { label: Phone shown to customers, name: phone, widget: string }
          - { label: WhatsApp number, name: whatsapp, widget: string, hint: "Country code and number, no spaces or +, for example 916389004433" }
          - { label: Dispatch line, name: dispatch_note, widget: string }
          - { label: Delivery line, name: delivery_note, widget: string }
          - { label: Made by (on product pages), name: manufacturer, widget: string }

  # ---------------------------------------------------------------- help pages
  - name: pages
    label: Help pages
    label_singular: Help page
    description: "Shipping, returns, terms, privacy and contact. If you change delivery charges in Shop settings, update the Shipping page too."
    folder: content/pages
    format: frontmatter
    extension: md
    create: false
    delete: false
    identifier_field: title
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Short description, name: description, widget: string, required: false }
      - { label: Text, name: body, widget: markdown }
