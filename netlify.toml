# Plain HTML, CSS and JS. The build turns what you add in the admin (/admin) into pages.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/products.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The shop's server code (checkout, PhonePe, orders). See netlify/functions/.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Never cache the shop's server answers or the orders screen.
[[headers]]
  for = "/admin/orders.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/shop.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
